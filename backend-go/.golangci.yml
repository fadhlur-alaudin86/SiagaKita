version: "2"

run:
  tests: false

linters:
  enable:
    - cyclop
    - gocognit
    - goconst
    - gosec
    - misspell
  settings:
    cyclop:
      max-complexity: 16
    gocognit:
      min-complexity: 30
    goconst:
      min-occurrences: 3
    misspell:
      locale: US
    gosec:
      excludes:
        - G304
        - G703
  exclusions:
    rules:
      - linters:
          - cyclop
          - gocognit
          - goconst
        path: (.+)_test\.go
      - linters:
          - cyclop
          - gocognit
        path: ^cmd/
      - linters:
          - gosec
        path: internal/i18n/i18n\.go
        text: "G101"
      - linters:
          - misspell
        text: "CANCELLED"
formatters:
  exclusions:
    generated: lax
