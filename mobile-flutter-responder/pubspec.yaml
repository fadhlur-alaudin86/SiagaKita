name: siagakita_responder
description: "SiagaKita Mobile Field Responder Application for Official Agency Personnel"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  geolocator: ^14.0.2
  permission_handler: ^13.0.2
  flutter_map: ^8.1.1
  latlong2: ^0.10.1
  audioplayers: ^6.4.0
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^11.0.0
  connectivity_plus: ^7.1.1
  url_launcher: ^6.3.0
  flutter_background_service: ^5.0.10
  flutter_local_notifications: ^22.3.0
  vibration: ^3.1.8
  web_socket_channel: ^3.0.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
