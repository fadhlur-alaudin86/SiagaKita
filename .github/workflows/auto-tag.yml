name: Auto-Tag on Main Merge

# Berjalan saat push ke main (termasuk merge PR)
on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'

jobs:
  create-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION file
        id: read_version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "Read version: v$VERSION"

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="${{ steps.read_version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists — skipping"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not exist — will create"
          fi

      - name: Create and Push Tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          TAG="${{ steps.read_version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" -m "Release $TAG (auto-tagged from VERSION file)"
          git push origin "$TAG"
          echo "Tag $TAG created and pushed — release-deploy.yml will trigger automatically"
