name: Deploy SiagaKita API to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'backend-go/**'
      - 'infrastructure/**'
      - '.github/workflows/**'

jobs:
  # ─── Job 1: Build image Go dan push ke Docker Hub ─────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-go
          file: ./backend-go/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/siagakita-api:latest

  # ─── Job 2: SSH ke VPS, pull image baru, restart backend ─────────────────
  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/siagakita

            # Pastikan DOCKERHUB_USERNAME tersedia di .env server
            # agar docker-compose.prod.yml bisa resolve image name
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"

            # Tarik image terbaru dari Docker Hub
            docker compose -f docker-compose.prod.yml pull backend

            # Restart HANYA backend (tidak menyentuh postgres/redis)
            docker compose -f docker-compose.prod.yml up -d --no-deps backend

            # Hapus image lama agar disk tidak penuh
            docker image prune -f

            # Verifikasi backend sehat
            sleep 5
            docker inspect --format='{{.State.Health.Status}}' siagakita_backend