name: Deploy SiagaKita API to VPS

on:
  push:
    branches:
      - main # Skrip ini hanya berjalan jika ada kode baru yang di-push ke branch main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-go
          file: ./backend-go/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/siagakita-api:latest

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/siagakita
            # Tarik image yang baru saja dirakit oleh GitHub
            docker compose -f docker-compose.prod.yml pull backend
            # Nyalakan ulang HANYA service backend tanpa menyentuh database
            docker compose -f docker-compose.prod.yml up -d --no-deps backend
            # Bersihkan sisa image lama agar disk server tidak penuh
            docker image prune -f