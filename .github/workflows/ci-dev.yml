name: CI — Dev Branch

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  # ─── Detect changed paths ─────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      mobile_main: ${{ steps.filter.outputs.mobile_main }}
      mobile_responder: ${{ steps.filter.outputs.mobile_responder }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend-go/**'
            mobile:
              - 'mobile-flutter/**'
              - 'mobile-flutter-responder/**'
            mobile_main:
              - 'mobile-flutter/**'
            mobile_responder:
              - 'mobile-flutter-responder/**'
            desktop:
              - 'windows_console_flutter/**'

  # ─── Go Backend CI ─────────────────────────────────────────────────────────
  ci-backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-go
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Check Format (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "❌ Files not formatted:"
            echo "$unformatted"
            exit 1
          fi
          echo "All Go files are properly formatted"

      - name: Vet
        run: go vet ./...

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: backend-go
          args: --timeout=5m

      - name: Vulnerability Check (govulncheck)
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: backend-go/go.mod
          go-package: ./...
          work-dir: backend-go
          repo-checkout: false

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v -race -timeout 60s

  # ─── Flutter Mobile CI ─────────────────────────────────────────────────────
  ci-mobile:
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ─── Mobile Flutter (Citizen / Volunteer) ───
      - name: Install Dependencies (mobile-flutter)
        if: ${{ needs.changes.outputs.mobile_main == 'true' }}
        working-directory: ./mobile-flutter
        run: flutter pub get

      - name: Check Format (mobile-flutter)
        if: ${{ needs.changes.outputs.mobile_main == 'true' }}
        working-directory: ./mobile-flutter
        run: dart format --set-exit-if-changed .

      - name: Check Localization Orphans (mobile-flutter)
        if: ${{ needs.changes.outputs.mobile_main == 'true' }}
        working-directory: ./mobile-flutter
        run: python3 ../scripts/check_localization_orphans.py --mobile

      - name: Analyze (mobile-flutter)
        if: ${{ needs.changes.outputs.mobile_main == 'true' }}
        working-directory: ./mobile-flutter
        run: flutter analyze --fatal-infos

      - name: Test (mobile-flutter)
        if: ${{ needs.changes.outputs.mobile_main == 'true' }}
        working-directory: ./mobile-flutter
        run: |
          if [ -d "test" ]; then
            flutter test
          fi

      # ─── Mobile Flutter Responder (Emergency Personnel) ───
      - name: Install Dependencies (mobile-flutter-responder)
        if: ${{ needs.changes.outputs.mobile_responder == 'true' }}
        working-directory: ./mobile-flutter-responder
        run: flutter pub get

      - name: Check Format (mobile-flutter-responder)
        if: ${{ needs.changes.outputs.mobile_responder == 'true' }}
        working-directory: ./mobile-flutter-responder
        run: dart format --set-exit-if-changed .

      - name: Check Localization Orphans (mobile-flutter-responder)
        if: ${{ needs.changes.outputs.mobile_responder == 'true' }}
        working-directory: ./mobile-flutter-responder
        run: python3 ../scripts/check_localization_orphans.py --responder

      - name: Analyze (mobile-flutter-responder)
        if: ${{ needs.changes.outputs.mobile_responder == 'true' }}
        working-directory: ./mobile-flutter-responder
        run: flutter analyze --fatal-infos

      - name: Test (mobile-flutter-responder)
        if: ${{ needs.changes.outputs.mobile_responder == 'true' }}
        working-directory: ./mobile-flutter-responder
        run: |
          if [ -d "test" ]; then
            flutter test
          fi

  # ─── Flutter Desktop CI ────────────────────────────────────────────────────
  ci-desktop:
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./windows_console_flutter
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Format (dart format)
        run: dart format --set-exit-if-changed .

      - name: Check Localization Orphans
        run: python3 ../scripts/check_localization_orphans.py --desktop

      - name: Analyze
        run: flutter analyze --fatal-infos
