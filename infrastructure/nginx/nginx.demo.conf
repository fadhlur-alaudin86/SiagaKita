# nginx.demo.conf - Reverse proxy for the demo droplet (HTTP only).
#
# Purpose: Serve all demo traffic (REST, WebSocket, uploads, console bundle) on
#          port 80 without TLS, because the demo droplet is reached by public IP.
# Data & Logic Flow: client (mobile/console) -> port 80 -> backend:8080
#          (REST, uploads) or backend:8081 (WebSocket upgrade).
# Key Components: upstream backend_api, upstream backend_ws, map $http_upgrade.
#
# Note: this file does NOT replace the production nginx.conf. That file keeps the
# HTTPS and Cloudflare Origin CA path for permanent production traffic, while this
# one is only for the temporary demo droplet.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 25M;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream backend_api {
        server backend:8080;
        keepalive 32;
    }

    upstream backend_ws {
        server backend:8081;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # --- HTTP server (port 80): all demo traffic ---
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Docker healthcheck
        location /health {
            proxy_pass http://backend_api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # REST API (/api/v1/...)
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Static uploads (proof photos, identity documents, certificates)
        location /uploads/ {
            alias /app/uploads/;
            expires 7d;
            add_header Cache-Control "public, no-transform";
            try_files $uri @backend_uploads;
        }

        # Flutter web build of the desktop console, served as static files.
        # Any browser can open a console instance without installing anything;
        # two tabs give the admin and agency consoles side by side. The bundle is
        # built with --base-href=/console/ so its assets resolve under this path.
        location /console/ {
            alias /app/console-web/;
            try_files $uri $uri/ /console/index.html;
            add_header Cache-Control "no-cache";
        }

        location = /console {
            return 301 /console/;
        }

        location @backend_uploads {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger UI, mounted by the backend only when GO_ENV is not production
        location /docs/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Real-time WebSocket (/v1/ws/connect)
        location ~ ^/(v1/ws/|ws/) {
            proxy_pass http://backend_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Persistent WebSocket, effectively no idle timeout
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
