openapi: 3.0.3

info:
  title: SiagaKita API
  version: "1.0.25"
  description: |
    ## SiagaKita REST API

    Backend for the SiagaKita emergency response platform.
    Connects civilian/volunteer mobile apps and admin/agency desktop consoles.

    ### Authentication
    Most endpoints require a **Bearer JWT** token obtained via the `/auth/login` or
    `/auth/console/login` endpoints. The SMS fallback gateway uses a static API key.

    ### Role Groups
    | Group | Roles Included |
    |-------|---------------|
    | CitizenVolunteer | `civilian`, `volunteer` |
    | VolunteerOnly | `volunteer` |
    | ConsoleOnly | `superadmin`, `admin`, `agency` |
    | AdminOnly | `admin`, `superadmin` |
    | AgencyOnly | `agency`, `admin`, `superadmin` |
    | SuperAdminOnly | `superadmin` |

    ### Session Enforcement
    - **Mobile app** (`civilian`, `volunteer`): Single-device login enforced via Redis JTI session guard.
    - **Console** (`admin`, `agency`, `superadmin`): Multiple connections allowed per user.

    ### Idempotency
    Console endpoints that change incident state require the `X-Idempotency-Key` header
    (UUID v4) to prevent duplicate submissions.

    ### File Upload
    - Max body size: **15 MB**
    - Uploaded files are served at `GET /uploads/*`

  contact:
    name: SiagaKita Dev Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.siagakita.app
    description: Production server (requires VPN/whitelist)

security:
  - BearerAuth: []

tags:
  - name: Auth
    description: Authentication and OTP endpoints (public — no JWT required)
  - name: Users
    description: User profile, biodata, KYC, and volunteer registration
  - name: Incidents (SOS)
    description: SOS lifecycle — trigger, broadcast, accept, resolve, false alarm, and reports
  - name: Reports
    description: Community incident reports (non-SOS, Jalur B)
  - name: Admin
    description: Admin management — users, KYC, agencies, ranks, badges, statistics
  - name: Agencies
    description: Agency profile and personnel management
  - name: Telemetry
    description: Real-time location and online status tracking

