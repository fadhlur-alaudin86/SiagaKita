# Users Domain — /api/v1/users
# All endpoints require Bearer JWT with role: civilian or volunteer
# Header: Authorization: Bearer <token>
# Session enforcement: SessionGuard (single device)

/api/v1/users/biodata:
  post:
    tags:
      - Users
    summary: Save/update user biodata
    description: |
      Saves initial or updated biodata for a civilian/volunteer user.
      **Required roles:** `civilian`, `volunteer`
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              nik:
                type: string
                example: "3273012345670001"
              phone_number:
                type: string
                example: "+6281234567890"
              place_of_birth:
                type: string
                example: "Jakarta"
              date_of_birth:
                type: string
                description: Format DD-MM-YYYY
                example: "15-06-1995"
              blood_type:
                type: string
                example: "O"
              allergies:
                type: string
                nullable: true
              medical_conditions:
                type: string
                nullable: true
              height_cm:
                type: integer
                example: 170
              weight_kg:
                type: integer
                example: 65
              domicile:
                type: string
                example: "Jakarta Selatan"
              emergency_contact_name:
                type: string
                example: "Siti Santoso"
              emergency_contact_phone:
                type: string
                example: "+6289876543210"
              emergency_relation:
                type: string
                example: "Ibu"
    responses:
      '200':
        description: Biodata saved successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../openapi.yaml#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        message:
                          type: string
                          example: "Biodata berhasil disimpan"
      '400':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'

/api/v1/users/profile:
  get:
    tags:
      - Users
    summary: Get current user profile
    description: Returns full profile of the authenticated civilian/volunteer.
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Profile returned
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../openapi.yaml#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../openapi.yaml#/components/schemas/ProfileResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Profile not found
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
  put:
    tags:
      - Users
    summary: Update current user profile
    description: Updates and returns the full profile of the authenticated user.
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              full_name:
                type: string
                nullable: true
              nik:
                type: string
                nullable: true
              phone_number:
                type: string
                nullable: true
              place_of_birth:
                type: string
                nullable: true
              date_of_birth:
                type: string
                nullable: true
                description: Format DD-MM-YYYY
              blood_type:
                type: string
                nullable: true
              allergies:
                type: string
                nullable: true
              medical_conditions:
                type: string
                nullable: true
              height_cm:
                type: integer
                nullable: true
              weight_kg:
                type: integer
                nullable: true
              domicile:
                type: string
                nullable: true
              bio:
                type: string
                nullable: true
              emergency_contacts:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    phone:
                      type: string
                    relation:
                      type: string
    responses:
      '200':
        description: Profile updated
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../openapi.yaml#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../openapi.yaml#/components/schemas/ProfileResponse'
      '400':
        description: Bad request
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'

/api/v1/users/profile/fcm-token:
  put:
    tags:
      - Users
    summary: Register or update FCM device token
    description: Stores the device FCM token for high-priority push notification delivery.
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - fcm_token
            properties:
              fcm_token:
                type: string
                example: "fcm_token_sample..."
    responses:
      '200':
        description: Token updated successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/SuccessResponse'
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
  delete:
    tags:
      - Users
    summary: Clear FCM device token on logout
    description: Clears the device FCM token to prevent cross-account push notifications.
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Token cleared successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/SuccessResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'

/api/v1/users/phone/request-otp:
  post:
    tags:
      - Users
    summary: Request WhatsApp OTP for phone number change
    description: |
      Sends a WhatsApp OTP to the new phone number to confirm ownership.
      Rate limited to once per minute.
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [phone_number]
            properties:
              phone_number:
                type: string
                example: "+6281234567890"
    responses:
      '200':
        description: OTP sent via WhatsApp
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/SuccessResponse'
      '400':
        description: Missing phone_number
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '429':
        description: Rate limited — wait 1 minute
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'

/api/v1/users/phone/verify-otp:
  post:
    tags:
      - Users
    summary: Verify WhatsApp OTP to confirm phone number
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [phone_number, otp_code]
            properties:
              phone_number:
                type: string
                example: "+6281234567890"
              otp_code:
                type: string
                example: "123456"
    responses:
      '200':
        description: Phone number verified
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../openapi.yaml#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        message:
                          type: string
                        verified:
                          type: boolean
                          example: true
      '400':
        description: Invalid or expired OTP
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'

/api/v1/users/kyc:
  post:
    tags:
      - Users
    summary: Submit NIK identity verification (KYC)
    description: |
      Accepts `multipart/form-data` with NIK identity data and document photos.
      The `selfie` file doubles as the user's profile photo.
      Status transitions to `pending` and is reviewed by admin (1–3 business days).
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [nik, full_name]
            properties:
              nik:
                type: string
                description: 16-digit Indonesian National ID number
                example: "3273012345670001"
              full_name:
                type: string
                maxLength: 100
                example: "Budi Santoso"
              place_of_birth:
                type: string
                maxLength: 100
                example: "Jakarta"
              date_of_birth:
                type: string
                example: "1995-06-15"
              ktp:
                type: string
                format: binary
                description: Photo of national ID card (KTP)
              selfie:
                type: string
                format: binary
                description: Selfie photo (also used as profile photo)
    responses:
      '200':
        description: KYC submission received
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../openapi.yaml#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        message:
                          type: string
                        status:
                          type: string
                          example: "pending"
      '400':
        description: Validation error (NIK must be 16 digits)
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'

/api/v1/users/kyc/status:
  get:
    tags:
      - Users
    summary: Get current KYC verification status
    security:
      - BearerAuth: []
    responses:
      '200':
        description: KYC status returned
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../openapi.yaml#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../openapi.yaml#/components/schemas/KYCStatusResponse'
      '404':
        description: Profile not found
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'

/api/v1/users/volunteer/register:
  post:
    tags:
      - Users
    summary: Submit volunteer registration application
    description: |
      Submits a volunteer registration for a `civilian` user.
      Requires KYC (NIK) to be approved first.
      Status transitions to `pending` until approved by admin.
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              experience:
                type: string
                example: "5 years in SAR operations"
              specializations:
                type: array
                items:
                  type: string
                example: ["SAR", "Medical First Aid"]
    responses:
      '200':
        description: Application submitted successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../openapi.yaml#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        message:
                          type: string
                        status:
                          type: string
                          example: "pending"
      '500':
        description: Server error
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'

/api/v1/users/ping:
  get:
    tags:
      - Users
    summary: Heartbeat — update last_active_at
    description: |
      Called by the mobile app every 30 seconds to update `last_active_at` in DB
      and set a 90-second Redis online status TTL key.
      Used by the console dashboard to show volunteer online status.
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Pong
        content:
          application/json:
            example:
              status: "ok"
