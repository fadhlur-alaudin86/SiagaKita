      type: string
      format: uuid
    name:
      type: string
    type:
      type: string
      enum: [police, fire, medical, sar]
    city_code:
      type: string
    hotline_number:
      type: string
      nullable: true
    latitude:
      type: number
      format: double
      nullable: true
    longitude:
      type: number
      format: double
      nullable: true

AdminUserItem:
  type: object
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
    role:
      type: string
    full_name:
      type: string
      nullable: true
    nik_verification_status:
      type: string
    is_sos_banned:
      type: boolean
    sos_strike_count:
      type: integer
    created_at:
      type: string
      format: date-time

StatsResponse:
  type: object
  properties:
    period:
      type: string
      enum: [week, month, year]
    total_sos:
      type: integer
    resolved_sos:
      type: integer
    false_alarm_sos:
      type: integer
    total_reports:
      type: integer
    active_volunteers:
      type: integer

# ─── Agency ───────────────────────────────────────────────────────────────────

AgencyProfile:
  type: object
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    type:
      type: string
      enum: [police, fire, medical, sar]
    city_code:
      type: string
    hotline_number:
      type: string
      nullable: true
    latitude:
      type: number
      format: double
      nullable: true
    longitude:
      type: number
      format: double
      nullable: true
    account_id:
      type: string
      format: uuid
